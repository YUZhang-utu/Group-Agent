[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidd-macrocycle-agent"
version = "0.2.0"
description = "Local-first AIDD macrocycle screening agent"
requires-python = ">=3.11"

[project.scripts]
aidd-agent = "aidd_agent.cli:main"
aidd-doctor = "aidd_agent.doctor:main"
aidd-chat = "aidd_agent.chat_web:main"

[project.optional-dependencies]
chemistry = ["rdkit"]
structures = ["gemmi", "biopython"]
workstation = ["rdkit", "gemmi", "biopython", "scipy", "pandas", "pyarrow", "faiss-cpu", "psutil"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
aidd_agent = ["web/*.html", "web/*.css", "web/*.js"]
