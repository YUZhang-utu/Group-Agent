<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDCHEM Agent</title><link rel="icon" type="image/png" href="/med.png"><link rel="stylesheet" href="/chat.css"><script defer src="/chat.js"></script></head>
<body><header class="masthead">
<div class="topbar"><a class="brand" href="/" aria-label="MEDCHEM Agent home"><img src="/med.png" alt="" width="38" height="38"><span class="sr-only">MEDCHEM Agent</span></a><div class="topbar-controls"><span id="connection" role="status">Connecting</span><div class="provider"><label class="sr-only" for="provider">Model service</label><select id="provider"><option value="deepseek">DeepSeek</option><option value="gpt">GPT</option></select><span id="compute" class="sr-only"></span></div><details id="results-menu" class="results-menu"><summary aria-controls="results-panel">Tasks &amp; results <span id="task-count" hidden></span><span aria-hidden="true">&#8599;</span></summary><aside id="results-panel" class="results-panel" aria-label="Tasks and results"><div class="task-heading"><h2>Tasks &amp; results</h2><button id="close-results" type="button" aria-label="Close tasks and results">&#215;</button></div><details class="attach-menu"><summary>Attach an existing result</summary><label for="attachment-kind">Result type</label><select id="attachment-kind"><option value="docking">Completed PLANTS report</option><option value="plan">Existing Chat plan</option></select><label for="existing" id="existing-label">PLANTS report.json path</label><input id="existing" placeholder="/project/runs/.../plants-final/report.json"><button id="attach">Attach result</button><p class="attach-note">Reuse saved results without rerunning calculations.</p></details><div id="docking-results"></div><div id="tasks"></div></aside></details></div></div>
<div class="hero" role="img" aria-label="MEDCHEM Agent: a cyclic peptide forms the letter D, surrounded by illustrative noncanonical cyclic peptides over a schematic aqueous and nonpolar solvent background.">
<div class="molecule-cloud" aria-hidden="true"><img class="peptide p1" src="/peptide-1.svg" alt=""><img class="peptide p2" src="/peptide-2.svg" alt=""><img class="peptide p3" src="/peptide-3.svg" alt=""><img class="peptide p4" src="/peptide-4.svg" alt=""><img class="peptide p5" src="/peptide-5.svg" alt=""><img class="peptide p6" src="/peptide-6.svg" alt=""></div>
<h1 class="wordmark" aria-hidden="true"><span class="wordmark-name"><span>ME</span><img class="peptide-letter" src="/peptide-d.svg" alt=""><span>CHEM</span></span><span class="wordmark-agent">Agent</span></h1>
</div></header>
<main><nav aria-label="Conversations"><button id="new">+ New conversation</button><details id="coverage-menu" class="coverage-menu"><summary>Workflow coverage <span aria-hidden="true">&#8599;</span></summary><div class="coverage-panel"><div class="coverage-title">From evidence to evaluation</div><div id="coverage"></div></div></details><div class="nav-label">CONVERSATIONS</div><div id="sessions"></div></nav>
<section class="conversation"><div class="conversation-heading"><h2>Research chat</h2></div><div id="messages" aria-live="polite"></div><div class="prompt-starters"><button data-prompt="Show my existing tasks and their current status. Do not start new computation.">Review my tasks</button><button data-prompt="List my attached docking results and explain the next analysis step. Do not rerun docking.">Review docking results</button><button data-prompt="Explain the available structure, screening and docking workflows and what inputs they require.">Explore workflows</button></div><div id="error" role="alert"></div><form id="compose"><label class="sr-only" for="prompt">Message MEDCHEM Agent</label><textarea id="prompt" rows="3" placeholder="Ask MEDCHEM Agent..." required></textarea><div class="actions"><span>Enter to send &middot; Shift + Enter for a new line</span><button id="send" type="submit">Send message &#8599;</button></div></form></section>
</main><footer>MEDCHEM Agent</footer></body></html>
